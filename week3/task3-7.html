<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
      body {
        font-family: sans-serif;
        background-color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        background-color: white;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        text-align: center;
        width: 300px;
      }
      .avatar {
        background-color: green;
        color: white;
        font-size: 2rem;
        border-radius: 50%;
        width: 80px;
        height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 1rem auto;
      }
      .name {
        font-size: 1.5rem;
        margin: 0.5rem 0;
      }
      .role {
        color: #6b7280;
        margin-bottom: 1rem;
      }
      hr {
        border: none;
        border-top: 1px solid #e5e7eb;
        margin: 1rem 0;
      }
      .skills {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
      }
      .badge {
        background-color: lightgreen;
        border-radius: 9999px;
        padding: 0.25rem 0.75rem;
        font-size: 0.875rem;
      }
      
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">MN</div>

    <h2 class="name">Enkhtsog Anand</h2>
    <p class="role">Web Programming Student</p>
    <p class="role">At Gachon University</p>
    <hr>
    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
    </div>
  </div>
</body>
</html>
