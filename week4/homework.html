
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Color Palette</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #101f4f;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #203f88;
      border-left: 10px solid #ffe21f;
      padding: 25px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 15px;
    }

    input {
      width: 170px;
    }

    button {
      background: #ffe21f;
      color: #172033;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      min-height: 22px;
      color: #8fffc4;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .color-box {
      min-height: 190px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .color-box:hover {
      transform: translateY(-3px);
    }

    .color-box.expanded {
      min-height: 260px;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .color-code {
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px 14px;
      border-radius: 5px;
      font-weight: bold;
    }

    .hint {
      margin-top: 25px;
      color: #cbd8f4;
      line-height: 1.6;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #b8c8ef;
    }

    @media (max-width: 500px) {
      body {
        padding: 14px;
      }

      .controls {
        flex-direction: column;
      }

      input, button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>Interactive Color Palette</h1>
      <p>Click a box to expand it. Double-click to remove it.</p>
    </header>

    <section class="controls">
      <input
        type="text"
        id="colorInput"
        placeholder="#FF5733"
        maxlength="7"
        aria-label="Enter hex color"
      >

      <button id="addColorBtn">Add Color</button>
      <button id="exportBtn">Export Palette as PNG</button>
      <button id="resetBtn">Reset Palette</button>
    </section>

    <p id="message" role="status"></p>

    <section id="palette" class="palette"></section>

    <p class="hint">
      Enter a hex color such as #2ECC71.
      Click a box to show its hex code.
      Double-click a box to remove it.
      Your palette is saved in this browser.
    </p>

    <footer>JavaScript DOM &amp; Events Practice</footer>
  </main>

  <script>
    const STORAGE_KEY = "interactiveColorPalette";

    const defaultColors = [
      "#E74C3C",
      "#3498DB",
      "#2ECC71",
      "#F1C40F",
      "#9B59B6",
      "#E67E22"
    ];

    const palette = document.getElementById("palette");
    const colorInput = document.getElementById("colorInput");
    const addColorBtn = document.getElementById("addColorBtn");
    const exportBtn = document.getElementById("exportBtn");
    const resetBtn = document.getElementById("resetBtn");
    const message = document.getElementById("message");

    let colors = loadColors();

    function isValidHex(color) {
      return /^#([0-9a-fA-F]{6})$/.test(color.trim());
    }

    function loadColors() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved !== null) {
          const parsed = JSON.parse(saved);

          if (
            Array.isArray(parsed) &&
            parsed.every(
              color => typeof color === "string" && isValidHex(color)
            )
          ) {
            return parsed;
          }
        }
      } catch (error) {
        console.log("Could not load saved colors.");
      }

      return [...defaultColors];
    }

    function saveColors() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(colors)
        );
      } catch (error) {
        showMessage("Could not save colors in this browser.");
      }
    }

    function showMessage(text) {
      message.textContent = text;
    }

    function getTextColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);

      const brightness =
        (r * 299 + g * 587 + b * 114) / 1000;

      return brightness > 145 ? "#172033" : "#ffffff";
    }

    function renderPalette() {
      palette.replaceChildren();

      colors.forEach((color, index) => {
        const box = document.createElement("div");

        box.className = "color-box";
        box.style.backgroundColor = color;
        box.style.color = getTextColor(color);
        box.setAttribute("tabindex", "0");
        box.setAttribute("role", "button");
        box.setAttribute("aria-label", "Color " + color);

        const code = document.createElement("span");

        code.className = "color-code";
        code.textContent = color;
        code.hidden = true;

        box.appendChild(code);

        box.addEventListener("click", () => {
          box.classList.toggle("expanded");

          code.hidden =
            !box.classList.contains("expanded");
        });

        box.addEventListener("dblclick", (event) => {
          event.preventDefault();

          colors.splice(index, 1);

          saveColors();
          renderPalette();

          showMessage(color + " removed.");
        });

        box.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            box.click();
          }
        });

        palette.appendChild(box);
      });
    }

    function addColor() {
      const color = colorInput.value.trim().toUpperCase();

      if (!isValidHex(color)) {
        showMessage(
          "Enter a valid 6-digit hex color, for example #FF5733."
        );

        colorInput.focus();
        return;
      }

      colors.push(color);

      saveColors();
      renderPalette();

      colorInput.value = "";

      showMessage(color + " added to your palette.");
    }

    function exportPaletteAsPNG() {
      if (colors.length === 0) {
        showMessage("Add at least one color before exporting.");
        return;
      }

      const columns = Math.min(3, colors.length);
      const rows = Math.ceil(colors.length / columns);

      const cellWidth = 300;
      const cellHeight = 180;
      const gap = 16;
      const padding = 24;
      const titleHeight = 64;

      const canvas = document.createElement("canvas");

      canvas.width =
        padding * 2 +
        columns * cellWidth +
        (columns - 1) * gap;

      canvas.height =
        padding * 2 +
        titleHeight +
        rows * cellHeight +
        (rows - 1) * gap;

      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#f3f5f9";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#1c2433";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "left";

      ctx.fillText(
        "Interactive Color Palette",
        padding,
        padding + 30
      );

      colors.forEach((color, index) => {
        const col = index % columns;
        const row = Math.floor(index / columns);

        const x = padding + col * (cellWidth + gap);
        const y =
          padding + titleHeight + row * (cellHeight + gap);

        ctx.fillStyle = color;
        ctx.fillRect(x, y, cellWidth, cellHeight);

        ctx.fillStyle = getTextColor(color);
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
          color,
          x + cellWidth / 2,
          y + cellHeight / 2 + 8
        );
      });

      const link = document.createElement("a");

      link.download = "color-palette.png";
      link.href = canvas.toDataURL("image/png");
      link.click();

      showMessage("Palette exported as color-palette.png.");
    }

    addColorBtn.addEventListener("click", addColor);

    colorInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        addColor();
      }
    });

    exportBtn.addEventListener(
      "click",
      exportPaletteAsPNG
    );

    resetBtn.addEventListener("click", () => {
      colors = [...defaultColors];

      saveColors();
      renderPalette();

      showMessage("Palette reset to the six default colors.");
    });

    renderPalette();
    saveColors();
  </script>
</body>
</html>
