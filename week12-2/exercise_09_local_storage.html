<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 09 — Local Storage</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 09</p><h1>Theme persistence</h1><p class="lead">Save a theme preference in localStorage and restore it on the next visit.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [light,setLight]=useState(()=>localStorage.getItem('week12-2-theme')==='light');useEffect(()=>{document.body.classList.toggle('light',light);localStorage.setItem('week12-2-theme',light?'light':'dark')},[light]);return <div className="result"><h2>{light?'Light':'Dark'} theme</h2><p>Your choice is saved in this browser.</p><button onClick={()=>setLight(v=>!v)}>Switch to {light?'dark':'light'} theme</button></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
