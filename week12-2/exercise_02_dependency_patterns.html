<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 02 — Dependency Patterns</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 02</p><h1>Dependency patterns</h1><p class="lead">Compare an effect that runs once, one that follows a value, and one that runs after every render.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [value,setValue]=useState(0);const [log,setLog]=useState([]);useEffect(()=>{setLog(x=>['Mount effect ran',...x].slice(0,8))},[]);useEffect(()=>{setLog(x=>[`Value effect: ${value}`, ...x].slice(0,8))},[value]);useEffect(()=>{document.querySelector('#render-count').textContent=Number(document.querySelector('#render-count').textContent)+1});return <><p>Value: <strong>{value}</strong></p><button onClick={()=>setValue(v=>v+1)}>Change value</button><p>Render count: <strong id="render-count">0</strong></p><ul className="result log">{log.map((item,i)=><li key={i}>{item}</li>)}</ul><pre>useEffect(effect, [])        // mount only
useEffect(effect, [value])  // when value changes
useEffect(effect)           // after every render</pre></>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
