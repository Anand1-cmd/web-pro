<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 12 — Derived Values</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 12</p><h1>Derived values</h1><p class="lead">Calculate values from current state during render instead of duplicating them in an effect.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useState}=React;function App(){const [price,setPrice]=useState(12);const [quantity,setQuantity]=useState(2);const total=price*quantity;const discount=total>=50?total*.1:0;return <><div className="row"><label>Price <input type="number" min="0" value={price} onChange={e=>setPrice(Number(e.target.value))}/></label><label>Quantity <input type="number" min="0" value={quantity} onChange={e=>setQuantity(Number(e.target.value))}/></label></div><div className="result"><p>Subtotal: ${total.toFixed(2)}</p><p>Discount: ${discount.toFixed(2)}</p><h2>Total: ${(total-discount).toFixed(2)}</h2></div><p className="muted">Subtotal and discount are derived directly from state—no effect needed.</p></>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
