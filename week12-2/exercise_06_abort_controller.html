<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 06 — AbortController</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 06</p><h1>AbortController</h1><p class="lead">Cancel the previous request when a new one starts.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useState,useRef}=React;function App(){const [id,setId]=useState(1);const [user,setUser]=useState(null);const [status,setStatus]=useState('Choose a user and load the profile.');const controller=useRef(null);async function load(){controller.current?.abort();const next=new AbortController();controller.current=next;setUser(null);setStatus('Loading…');try{const r=await fetch(`https://jsonplaceholder.typicode.com/users/${id}`,{signal:next.signal});if(!r.ok)throw Error('User not found');const data=await r.json();setUser(data);setStatus('Loaded successfully.')}catch(e){if(e.name!=='AbortError')setStatus(e.message)}}return <><div className="row"><label htmlFor="user-id">User ID</label><select id="user-id" value={id} onChange={e=>setId(e.target.value)}>{Array.from({length:10},(_,i)=><option key={i+1}>{i+1}</option>)}</select><button onClick={load}>Load user</button><button className="secondary" onClick={()=>controller.current?.abort()}>Cancel request</button></div><p className="status" aria-live="polite">{status}</p>{user&&<div className="result"><h2>{user.name}</h2><p>{user.email}</p></div>}</>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
