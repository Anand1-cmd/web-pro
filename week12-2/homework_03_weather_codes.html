<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homework 03 — Weather Codes</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">HOMEWORK 03</p><h1>Weather descriptions</h1><p class="lead">Translate Open-Meteo weather codes into a readable forecast.</p><form id="form" class="row"><input id="city" value="Seoul" required placeholder="City name"><button>Get conditions</button></form><p id="status" class="status" aria-live="polite">Ready.</p><div id="result"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script>const labels={0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],61:['Light rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],80:['Rain showers','🌦️'],81:['Moderate showers','🌧️'],82:['Heavy showers','🌧️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm with hail','⛈️'],99:['Thunderstorm with hail','⛈️']};const form=document.querySelector('#form'),status=document.querySelector('#status'),out=document.querySelector('#result');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Loading…';out.replaceChildren();try{const city=document.querySelector('#city').value.trim();const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);const place=(await g.json()).results?.[0];if(!place)throw Error('City not found.');const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code`);const d=await r.json();const [description,icon]=labels[d.current.weather_code]||['Unknown conditions','🌡️'];status.textContent=`${place.name}, ${place.country}`;const box=document.createElement('article');box.className='weather';box.innerHTML=`<span class="temperature">${icon}</span>`;const text=document.createElement('div');text.textContent=`${description} · ${Math.round(d.current.temperature_2m)}${d.current_units.temperature_2m}`;box.append(text);out.append(box)}catch(err){status.textContent=err.message;status.classList.add('error')}});</script></body></html>
