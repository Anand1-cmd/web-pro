<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homework 02 — City Search</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">HOMEWORK 02</p><h1>City search</h1><p class="lead">Look up a city, then fetch its current weather.</p><form id="form" class="row"><input id="city" required placeholder="City name" value="Seoul"><button>Search</button></form><p id="status" class="status" aria-live="polite">Enter a city to begin.</p><div id="weather"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script>const form=document.querySelector('#form'),status=document.querySelector('#status'),weather=document.querySelector('#weather');form.addEventListener('submit',async e=>{e.preventDefault();const city=document.querySelector('#city').value.trim();status.textContent='Searching…';weather.replaceChildren();try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);if(!g.ok)throw Error('City lookup failed.');const place=(await g.json()).results?.[0];if(!place)throw Error('No matching city found.');const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,wind_speed_10m`);if(!r.ok)throw Error('Weather lookup failed.');const d=await r.json();status.textContent=`${place.name}, ${place.country}`;const card=document.createElement('article');card.className='weather';card.textContent=`${Math.round(d.current.temperature_2m)}${d.current_units.temperature_2m} · Wind ${d.current.wind_speed_10m}${d.current_units.wind_speed_10m}`;weather.append(card)}catch(err){status.textContent=err.message;status.classList.add('error')}});</script></body></html>
