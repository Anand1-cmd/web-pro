<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homework 04 — Geolocation Weather</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">HOMEWORK 04</p><h1>Geolocation weather</h1><p class="lead">Use your browser location or search for a city.</p><form id="form" class="row"><input id="city" placeholder="City name"><button>Search city</button><button id="geo" type="button" class="secondary">Use my location</button></form><p id="status" class="status" aria-live="polite">Choose a city or allow location access.</p><div id="result"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script>const status=document.querySelector('#status'),out=document.querySelector('#result');async function show(lat,lon,name){status.textContent='Loading weather…';out.replaceChildren();try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,wind_speed_10m`);if(!r.ok)throw Error('Weather service unavailable.');const d=await r.json();status.textContent=name;const box=document.createElement('article');box.className='weather';box.textContent=`${Math.round(d.current.temperature_2m)}${d.current_units.temperature_2m} · Feels like ${Math.round(d.current.apparent_temperature)}${d.current_units.apparent_temperature} · Wind ${d.current.wind_speed_10m}${d.current_units.wind_speed_10m}`;out.append(box)}catch(e){status.textContent=e.message}}document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const name=document.querySelector('#city').value.trim();if(!name){status.textContent='Enter a city name.';return}status.textContent='Searching…';try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`);const p=(await r.json()).results?.[0];if(!p)throw Error('City not found.');show(p.latitude,p.longitude,`${p.name}, ${p.country}`)}catch(err){status.textContent=err.message}});document.querySelector('#geo').addEventListener('click',()=>{if(!navigator.geolocation){show(37.57,126.98,'Seoul (location unavailable)');return}status.textContent='Requesting location…';navigator.geolocation.getCurrentPosition(p=>show(p.coords.latitude,p.coords.longitude,'Your location'),()=>{status.textContent='Location permission denied or unavailable.'},{timeout:10000})});</script></body></html>
