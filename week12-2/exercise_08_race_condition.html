<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 08 — Race Conditions</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 08</p><h1>Race conditions</h1><p class="lead">Only the latest search should be allowed to update the result.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useState,useRef}=React;function App(){const [query,setQuery]=useState('');const [result,setResult]=useState('');const [status,setStatus]=useState('Type a city and search.');const latest=useRef(0);async function search(e){e.preventDefault();const q=query.trim();if(!q)return;const request=++latest.current;setStatus(`Searching for ${q}…`);setResult('');try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);const data=await r.json();if(request!==latest.current)return;if(!data.results?.length)throw Error('No city found.');setResult(`${data.results[0].name}, ${data.results[0].country}`);setStatus('Latest result displayed.')}catch(err){if(request===latest.current)setStatus(err.message)}}return <><form className="row" onSubmit={search}><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search a city"/><button>Search</button></form><p className="status" aria-live="polite">{status}</p>{result&&<h2 className="result">{result}</h2>}<p className="muted">The request counter prevents a slow older response from replacing a newer search.</p></>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
