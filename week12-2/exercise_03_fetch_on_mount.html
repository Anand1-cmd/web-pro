<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 03 — Fetch on Mount</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 03</p><h1>Fetch on mount</h1><p class="lead">Load a sample post once when this component mounts.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [post,setPost]=useState(null);const [error,setError]=useState('');useEffect(()=>{fetch('https://jsonplaceholder.typicode.com/posts/1').then(r=>{if(!r.ok)throw Error('Request failed');return r.json()}).then(setPost).catch(e=>setError(e.message))},[]);if(error)return <p className="error result">Could not load post: {error}</p>;if(!post)return <p className="result" aria-live="polite">Loading post…</p>;return <article className="result"><p className="eyebrow">POST {post.id}</p><h2>{post.title}</h2><p>{post.body}</p></article>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
