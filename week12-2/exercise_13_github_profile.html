<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 13 — Debounced GitHub Profile</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 13</p><h1>Debounced GitHub profile</h1><p class="lead">Wait briefly after typing before requesting a profile, and cancel stale work.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [name,setName]=useState('octocat');const [user,setUser]=useState(null);const [status,setStatus]=useState('Type a username.');useEffect(()=>{if(!name.trim()){setUser(null);setStatus('Enter a username.');return}const controller=new AbortController();setStatus('Waiting to search…');const timer=setTimeout(async()=>{setStatus('Loading profile…');try{const r=await fetch(`https://api.github.com/users/${encodeURIComponent(name.trim())}`,{signal:controller.signal});if(!r.ok)throw Error(r.status===404?'User not found.':'GitHub request failed.');setUser(await r.json());setStatus('Profile loaded.')}catch(e){if(e.name!=='AbortError'){setUser(null);setStatus(e.message)}}},500);return()=>{clearTimeout(timer);controller.abort()}},[name]);return <><label htmlFor="gh-name">Username</label><input id="gh-name" value={name} onChange={e=>setName(e.target.value)} placeholder="GitHub username"/><p className="status" aria-live="polite">{status}</p>{user&&<article className="profile-box"><h2>{user.name||user.login}</h2><p>@{user.login} · {user.public_repos} public repositories</p><p>{user.bio||'No bio provided.'}</p><a href={user.html_url} target="_blank" rel="noreferrer">Open GitHub profile ↗</a></article>}</>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
