<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 11 — Effect Loops</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 11</p><h1>Effect loops</h1><p class="lead">An effect that updates a dependency on every run can create an infinite render loop.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [count,setCount]=useState(0);const [safe,setSafe]=useState(false);const [runs,setRuns]=useState(0);useEffect(()=>{setRuns(v=>v+1);if(safe&&count<3)setCount(c=>c+1)},[safe]);return <><p>Counter: <strong>{count}</strong> · effect runs: <strong>{runs}</strong></p><button onClick={()=>{setSafe(true);setCount(0)}}>Run bounded example</button><button className="secondary" onClick={()=>{setSafe(false);setCount(c=>c+1)}}>Increment manually</button><p className="result">Avoid changing a state value that is also a dependency unless the update is guarded. This example stops at 3.</p><pre>// Risky: effect runs after each count change
useEffect(() =&gt; setCount(count + 1), [count]);</pre></>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
