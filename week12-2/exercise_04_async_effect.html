<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 04 — Async Effect</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 04</p><h1>Async effect</h1><p class="lead">Keep the effect callback synchronous; define and call an async function inside it.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [user,setUser]=useState(null);const [error,setError]=useState('');useEffect(()=>{let active=true;async function loadUser(){try{const response=await fetch('https://jsonplaceholder.typicode.com/users/1');if(!response.ok)throw Error('User request failed');const data=await response.json();if(active)setUser(data)}catch(e){if(active)setError(e.message)}}loadUser();return()=>{active=false}},[]);return error?<p className="error result">{error}</p>:user?<div className="result"><h2>{user.name}</h2><p>{user.email}</p><p>{user.company.name}</p></div>:<p className="result" aria-live="polite">Loading user…</p>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
