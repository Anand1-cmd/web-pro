<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 10 — Document Title</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 10</p><h1>Document title</h1><p class="lead">Keep the browser tab title synchronized with the text you enter.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [name,setName]=useState('');useEffect(()=>{document.title=name?`${name} · Week 12-2`:'Document Title · Week 12-2';return()=>{document.title='Document Title · Week 12-2'}},[name]);return <><label htmlFor="title-name">Your name</label><input id="title-name" value={name} onChange={e=>setName(e.target.value)} placeholder="Type to update the tab title"/><p className="result">Current tab title: <strong>{name?`${name} · Week 12-2`:'Document Title · Week 12-2'}</strong></p></>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
