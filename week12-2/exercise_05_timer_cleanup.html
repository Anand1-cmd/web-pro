<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 05 — Timer Cleanup</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 05</p><h1>Timer cleanup</h1><p class="lead">Start and stop a one-second timer without leaving old intervals running.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [running,setRunning]=useState(false);const [ticks,setTicks]=useState(0);useEffect(()=>{if(!running)return;const timer=setInterval(()=>setTicks(t=>t+1),1000);return()=>clearInterval(timer)},[running]);return <><div className="row"><button onClick={()=>setRunning(v=>!v)}>{running?'Stop timer':'Start timer'}</button><button className="secondary" onClick={()=>setTicks(0)}>Reset</button></div><div className="result"><h2>{ticks} seconds</h2><p>{running?'Timer is running.':'Timer is stopped.'}</p></div></>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
