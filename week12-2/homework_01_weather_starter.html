<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homework 01 — Weather Starter</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">HOMEWORK 01</p><h1>Weather starter</h1><p class="lead">Fetch current conditions for a sample location using Open-Meteo.</p><div id="result" class="result" aria-live="polite">Loading weather…</div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script>const out=document.querySelector('#result');async function loadWeather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&current=temperature_2m,wind_speed_10m');if(!r.ok)throw Error('Weather service unavailable.');const data=await r.json();out.textContent=`Seoul · ${Math.round(data.current.temperature_2m)}${data.current_units.temperature_2m} · Wind ${data.current.wind_speed_10m}${data.current_units.wind_speed_10m}`}catch(e){out.textContent=e.message;out.classList.add('error')}}loadWeather();</script></body></html>
