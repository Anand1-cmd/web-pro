<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 07 — GitHub Lookup</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 07</p><h1>GitHub lookup</h1><p class="lead">Search for a GitHub account and display public profile details.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useState}=React;function App(){const [name,setName]=useState('octocat');const [user,setUser]=useState(null);const [status,setStatus]=useState('Search any GitHub username.');async function search(e){e.preventDefault();if(!name.trim())return;setUser(null);setStatus('Searching…');try{const r=await fetch(`https://api.github.com/users/${encodeURIComponent(name.trim())}`);if(r.status===404)throw Error('No matching GitHub user.');if(!r.ok)throw Error('GitHub API request failed.');setUser(await r.json());setStatus('Profile found.')}catch(err){setStatus(err.message)}}return <><form className="row" onSubmit={search}><input aria-label="GitHub username" value={name} onChange={e=>setName(e.target.value)} placeholder="username"/><button>Search</button></form><p className="status" aria-live="polite">{status}</p>{user&&<article className="profile-box"><h2>{user.name||user.login}</h2><p>@{user.login} · {user.location||'Location not listed'}</p><p>{user.bio||'No bio provided.'}</p><p>Repositories: {user.public_repos} · Followers: {user.followers}</p><a href={user.html_url} target="_blank" rel="noreferrer">View GitHub profile ↗</a></article>}</>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
