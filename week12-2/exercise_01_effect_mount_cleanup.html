<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 01 — Mount & Cleanup</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><a class="back" href="./">← Week 12-2 home</a><section class="card"><p class="eyebrow">EXERCISE 01</p><h1>Mount and cleanup</h1><p class="lead">An effect can start work when a component appears and clean it up when it goes away.</p><div id="root" class="demo"></div></section><footer>© 2026 Enkhtsog Anand — Web Pro Submissions</footer></main>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">const {useEffect,useState}=React;function App(){const [shown,setShown]=useState(true);return <><button onClick={()=>setShown(!shown)}>{shown?'Unmount component':'Mount component'}</button>{shown&&<Clock/>}</>}function Clock(){const [seconds,setSeconds]=useState(0);useEffect(()=>{const id=setInterval(()=>setSeconds(s=>s+1),1000);return()=>clearInterval(id)},[]);return <div className="result"><h2>Component is mounted</h2><p>Elapsed time: <strong>{seconds}</strong> seconds</p><p className="muted">Unmount to clear the interval.</p></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
