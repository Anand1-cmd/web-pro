<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  /* TODO: declare :root variables */
  :root { 
    --primary: #3498db;
    --accent: #e74c3c;
    --bg: #ecf0f1;
    --text: #2c3e50;
    --radius: 8px;
  }
@media (prefers-color-scheme: dark) {
  :root{
    --bg: #2c3e50;
    --text: #ecf0f1;
  }

  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: sans-serif; 
    padding: 20px; }

  .btn {
    background: var(--primary);
    color: white; 
    border: none; 
    padding: 10px 20px; 
    cursor: pointer;
    border-radius: var(--radius);
    transition: background 0.3s ease;
  }
  .card {
    background: var(--bg); 
    border: 1px solid var(--accent); 
    border-radius: var(--radius);
    padding: 20px; margin-top: 16px;
    color: var(--text);
  }
}
</style>
</head>
<body>
  <button class="btn">Click Me</button>
  <div class="card">A themed card using CSS variables</div>
</body>
</html>
