<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product card &amp; Portfolio gallery</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b0b0c;
      --bg-card: #141416;
      --bg-elevated: #1c1c20;
      --gold: #d4af37;
      --gold-hover: #e6c34a;
      --champagne: #f7e7ce;
      --champagne-muted: #cbbba0;
      --border-gold: rgba(212, 175, 55, 0.35);
      --danger: #e06c75;
      --success: #98c379;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--champagne);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 2.5rem 1.5rem;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    header.page-header {
      border-bottom: 1px solid var(--border-gold);
      padding-bottom: 1.25rem;
      margin-bottom: 2.5rem;
    }

    header.page-header h1 {
      color: var(--gold);
      font-size: 2rem;
      letter-spacing: 0.03em;
    }

    header.page-header p {
      color: var(--champagne-muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    section.task-section {
      margin-bottom: 3.5rem;
    }

    .section-title {
      color: var(--gold);
      font-size: 1.4rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 1.3rem;
      background-color: var(--gold);
      border-radius: 2px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 1.35rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
    }

    .product-title {
      color: var(--champagne);
      font-size: 1.15rem;
      margin-bottom: 0.4rem;
    }

    .product-price {
      color: var(--gold);
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.45rem;
    }

    .product-rating {
      color: var(--champagne-muted);
      font-size: 0.9rem;
      margin-bottom: 0.85rem;
    }

    .stock-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .in-stock {
      background: rgba(152, 195, 121, 0.15);
      color: var(--success);
      border: 1px solid rgba(152, 195, 121, 0.4);
    }

    .out-of-stock {
      background: rgba(224, 108, 117, 0.15);
      color: var(--danger);
      border: 1px solid rgba(224, 108, 117, 0.4);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      background: var(--bg-card);
      color: var(--champagne);
      border: 1px solid var(--border-gold);
      padding: 0.45rem 1.05rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .filter-btn.active {
      background: var(--gold);
      color: var(--bg-dark);
      border-color: var(--gold);
      font-weight: 700;
    }

    .project-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.35rem;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
    }

    .project-card h3 {
      color: var(--gold);
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
    }

    .project-card p {
      color: var(--champagne-muted);
      font-size: 0.92rem;
      margin-bottom: 1rem;
    }

    .tech-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.15rem;
    }

    .tech-badge {
      background: var(--bg-elevated);
      color: var(--champagne);
      border: 1px solid rgba(247, 231, 206, 0.2);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.78rem;
    }

    .project-links {
      display: flex;
      gap: 1rem;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 0.85rem;
    }

    .project-links a {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .project-links a:hover {
      color: var(--champagne);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    function ProductCard({ name, price, rating, inStock }) {
      const fullStars = Math.round(rating);
      const starsDisplay = "★".repeat(fullStars) + "☆".repeat(5 - fullStars);

      return (
        <div className="product-card">
          <h3 className="product-title">{name}</h3>
          <p className="product-price">{price.toLocaleString()}원</p>
          <p className="product-rating">
            {starsDisplay} ({rating} / 5 stars)
          </p>
          <span className={`stock-badge ${inStock ? "in-stock" : "out-of-stock"}`}>
            {inStock ? "In Stock" : "Out of Stock"}
          </span>
        </div>
      );
    }

    const PROJECTS_DATA = [
      {
        id: 1,
        title: "Profile card",
        description: "Profile card and Notification list",
        techStack: ["React", "CSS"],
        githubUrl: "https://github.com/Anand1-cmd/web-pro/tree/main/week11",
        demoUrl: "https://anand1-cmd.github.io/web-pro/week11/"
      },
      {
        id: 2,
        title: "Student directory",
        description: "Student directory with 3 student example",
        techStack: ["Node", "CSS"],
        githubUrl: "https://github.com/Anand1-cmd/nodejs/tree/main/src",
        demoUrl: "https://anand1-cmd.github.io/nodejs/"
      },
      {
        id: 3,
        title: "Personal portfolio",
        description: "Personal portfolio setup for future improvements",
        techStack: ["React", "Node"],
        githubUrl: "https://github.com/Anand1-cmd/Portfolio",
        demoUrl: "https://anand1-cmd.github.io/Portfolio/"
      },
    ];

    const TECHNOLOGIES = ["All", "React", "Node", "CSS"];

    function FilterBar({ technologies, selectedTech, onSelectTech }) {
      return (
        <div className="filter-bar">
          {technologies.map((tech) => (
            <button
              key={tech}
              type="button"
              className={selectedTech === tech ? "filter-btn active" : "filter-btn"}
              onClick={() => onSelectTech(tech)}
            >
              {tech}
            </button>
          ))}
        </div>
      );
    }

    function ProjectCard({ title, description, techStack, githubUrl, demoUrl }) {
      return (
        <article className="project-card">
          <div>
            <h3>{title}</h3>
            <p>{description}</p>
            <ul className="tech-list">
              {techStack.map((tech) => (
                <li key={tech} className="tech-badge">
                  {tech}
                </li>
              ))}
            </ul>
          </div>
          <div className="project-links">
            <a href={githubUrl} target="_blank" rel="noreferrer">
              GitHub &rarr;
            </a>
            <a href={demoUrl} target="_blank" rel="noreferrer">
              Live Demo &rarr;
            </a>
          </div>
        </article>
      );
    }

    function ProjectList({ projects }) {
      if (projects.length === 0) {
        return <p>No projects match this filter.</p>;
      }

      return (
        <div className="project-list">
          {projects.map((project) => (
            <ProjectCard
              key={project.id}
              title={project.title}
              description={project.description}
              techStack={project.techStack}
              githubUrl={project.githubUrl}
              demoUrl={project.demoUrl}
            />
          ))}
        </div>
      );
    }

    function App() {
      const [selectedTech, setSelectedTech] = useState("All");

      const filteredProjects =
        selectedTech === "All"
          ? PROJECTS_DATA
          : PROJECTS_DATA.filter((project) =>
              project.techStack.includes(selectedTech)
            );

      return (
        <div className="container">
          <header className="page-header">
            <h1>React Components &amp; Props</h1>
          </header>

          <section className="task-section">
            <h2 className="section-title">ProductCard</h2>
            <div className="product-grid">
              <ProductCard
                name="Wireless Earbuds"
                price={89000}
                rating={4.5}
                inStock={true}
              />
              <ProductCard
                name="Mechanical Keyboard"
                price={145000}
                rating={4.8}
                inStock={false}
              />
              <ProductCard
                name="USB-C Docking Station"
                price={62000}
                rating={4.2}
                inStock={true}
              />
            </div>
          </section>

          <section className="task-section">
            <h2 className="section-title">Homework: Portfolio Gallery</h2>
            <FilterBar
              technologies={TECHNOLOGIES}
              selectedTech={selectedTech}
              onSelectTech={setSelectedTech}
            />
            <ProjectList projects={filteredProjects} />
          </section>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
