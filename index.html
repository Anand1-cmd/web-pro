<body>
     <h1> Hello i am Anand.</h1>

     <p>I love to ride bicycles.</p>

     <canvas id="myCanvas" width="500" height="500" style="border:1px solid #d3d3d3;">
        </canvas>
        <script>
            var c = document.getElementById("myCanvas");
            var ctx = c.getContext("2d");
            var grd = ctx.createLinearGradient(0, 500, 200, 0);
            grd.addColorStop(0, "#0a3448");
            grd.addColorStop(1, "#00b2e3");
            ctx.fillStyle = grd;
            ctx.fillRect(25, 25, 450, 450);

        </script>
</body>
