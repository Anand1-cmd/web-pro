<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Shopping Cart</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-obsidian: #0b0a09;
      --bg-card: #14120f;
      --bg-elevated: #1d1914;
      --bg-panel: #181410;
      --border-gold: rgba(212, 175, 55, 0.34);
      --border-champagne: rgba(243, 229, 171, 0.22);
      --gold: #d4af37;
      --gold-bright: #e5c158;
      --champagne: #f3e5ab;
      --champagne-muted: #cbb98c;
      --text-primary: #faf4e4;
      --text-secondary: #b9aa88;
      --danger-text: #f3a69e;
      --danger-border: rgba(224, 108, 95, 0.45);
      --danger-bg: rgba(185, 56, 44, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1b1610 0%, var(--bg-obsidian) 70%);
      color: var(--text-primary);
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .card {
      background: linear-gradient(180deg, #171410 0%, var(--bg-card) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 1.75rem;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(243, 229, 171, 0.06);
    }

    h1, h2, h3, h4 {
      margin-top: 0;
      color: var(--champagne);
    }

    h2 {
      letter-spacing: 0.03em;
      border-bottom: 1px solid var(--border-champagne);
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      font-size: 0.92rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 100%);
      color: #120f0a;
      transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.28);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: var(--bg-elevated);
      color: var(--champagne);
      border-color: var(--border-champagne);
    }

    button.secondary:hover {
      background: #28221b;
      border-color: var(--gold);
    }

    button.danger {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-color: var(--danger-border);
    }

    button.danger:hover {
      background: rgba(185, 56, 44, 0.32);
      box-shadow: none;
    }

    .shop-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 840px) {
      .shop-layout {
        grid-template-columns: 1fr;
      }
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 1rem;
    }

    .product-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-champagne);
      border-radius: 10px;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .product-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .product-card img {
      width: 100%;
      height: 132px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(243, 229, 171, 0.14);
      background: #241f18;
    }

    .price-tag {
      margin: 0;
      font-weight: 700;
      color: var(--gold-bright);
    }

    .cart-panel {
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 1.15rem;
      background: var(--bg-panel);
    }

    .cart-list {
      list-style: none;
      padding: 0;
      margin: 0 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-champagne);
    }

    .item-sub {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .qty-controls button {
      padding: 0.25rem 0.55rem;
    }

    .qty-count {
      min-width: 1.25rem;
      text-align: center;
      color: var(--champagne);
      font-weight: 600;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      font-weight: 700;
      padding-top: 0.5rem;
      color: var(--champagne);
    }

    .cart-total span:last-child {
      color: var(--gold-bright);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const PRODUCTS = [
      {
        id: 1,
        name: "Mechanical Keyboard",
        price: 85,
        image: "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=400"
      },
      {
        id: 2,
        name: "Wireless Mouse",
        price: 45,
        image: "https://images.unsplash.com/photo-1527814050087-3793815479db?w=400"
      },
      {
        id: 3,
        name: "USB-C Hub",
        price: 35,
        image: "https://images.unsplash.com/photo-1625723044792-44de16ccb4e9?w=400"
      },
      {
        id: 4,
        name: "Minimal Desk Lamp",
        price: 40,
        image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400"
      },
      {
        id: 5,
        name: "Studio Headphones",
        price: 120,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
      }
    ];

    function ProductList({ products, onAddToCart }) {
      return (
        <div>
          <h3>Products</h3>
          <div className="product-grid">
            {products.map((product) => (
              <div key={product.id} className="product-card">
                <div>
                  <img src={product.image} alt={product.name} />
                  <h4 style={{ margin: "0.65rem 0 0.25rem" }}>{product.name}</h4>
                  <p className="price-tag">${product.price.toFixed(2)}</p>
                </div>
                <button onClick={() => onAddToCart(product)}>Add to Cart</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CartSidebar({ cart, onUpdateQuantity, onRemoveItem }) {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      return (
        <aside className="cart-panel">
          <h3>Cart Sidebar ({totalItems})</h3>

          {cart.length === 0 ? (
            <p style={{ color: "var(--text-secondary)" }}>Your cart is empty.</p>
          ) : (
            <ul className="cart-list">
              {cart.map((item) => (
                <li key={item.id} className="cart-item">
                  <div>
                    <strong>{item.name}</strong>
                    <div className="item-sub">
                      ${item.price.toFixed(2)} × {item.quantity} = $
                      {(item.price * item.quantity).toFixed(2)}
                    </div>
                  </div>

                  <div className="qty-controls">
                    <button
                      className="secondary"
                      onClick={() => onUpdateQuantity(item.id, -1)}
                    >
                      -
                    </button>
                    <span className="qty-count">{item.quantity}</span>
                    <button
                      className="secondary"
                      onClick={() => onUpdateQuantity(item.id, 1)}
                    >
                      +
                    </button>
                    <button
                      className="danger"
                      onClick={() => onRemoveItem(item.id)}
                    >
                      Remove
                    </button>
                  </div>
                </li>
              ))}
            </ul>
          )}

          <div className="cart-total">
            <span>Total:</span>
            <span>${totalPrice.toFixed(2)}</span>
          </div>
        </aside>
      );
    }

    function ShoppingCart() {
      const [cart, setCart] = useState([]);

      const handleAddToCart = (product) => {
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) =>
              item.id === product.id
                ? { ...item, quantity: item.quantity + 1 }
                : item
            );
          }
          return [...prev, { ...product, quantity: 1 }];
        });
      };

      const handleUpdateQuantity = (id, delta) => {
        setCart((prev) =>
          prev
            .map((item) =>
              item.id === id ? { ...item, quantity: item.quantity + delta } : item
            )
            .filter((item) => item.quantity > 0)
        );
      };

      const handleRemoveItem = (id) => {
        setCart((prev) => prev.filter((item) => item.id !== id));
      };

      return (
        <main className="container">
          <section className="card">
            <h2>Interactive Shopping Cart</h2>
            <div className="shop-layout">
              <ProductList products={PRODUCTS} onAddToCart={handleAddToCart} />
              <CartSidebar
                cart={cart}
                onUpdateQuantity={handleUpdateQuantity}
                onRemoveItem={handleRemoveItem}
              />
            </div>
          </section>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ShoppingCart />);
  </script>
</body>
</html>
