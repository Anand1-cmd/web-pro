<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 3 — Lift State Between Two Counters</title>

  <style>
    :root {
      --bg-obsidian: #0b0a09;
      --bg-card: #14120f;
      --bg-elevated: #1d1914;
      --border-gold: rgba(212, 175, 55, 0.34);
      --border-champagne: rgba(243, 229, 171, 0.22);
      --gold: #d4af37;
      --gold-bright: #e5c158;
      --champagne: #f3e5ab;
      --text-primary: #faf4e4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1b1610 0%, var(--bg-obsidian) 70%);
      color: var(--text-primary);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: linear-gradient(180deg, #171410 0%, var(--bg-card) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(243, 229, 171, 0.06);
      width: 100%;
      max-width: 540px;
    }

    h2 {
      margin: 0 0 1.25rem;
      font-size: 1.25rem;
      color: var(--champagne);
      border-bottom: 1px solid var(--border-champagne);
      padding-bottom: 0.65rem;
    }

    .scoreboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .player-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-champagne);
      border-radius: 10px;
      padding: 1.1rem;
    }

    .player-box h3 {
      margin: 0 0 0.85rem;
      color: var(--champagne);
    }

    .row {
      display: flex;
      gap: 0.6rem;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 100%);
      color: #120f0a;
      transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.28);
      transform: translateY(-1px);
    }

    button.secondary {
      background: var(--bg-elevated);
      color: var(--champagne);
      border-color: var(--border-champagne);
    }

    button.secondary:hover {
      background: #28221b;
      border-color: var(--gold);
    }

    .total-score {
      margin: 1.35rem 0 0;
      font-size: 1.35rem;
      color: var(--gold-bright);
    }
  </style>
</head>
<body>
  <main class="card">
    <h2>Lift State Between Two Counters</h2>
    <div class="scoreboard-grid">
      <div class="player-box">
        <h3 id="p1-label">Player 1: 0</h3>
        <div class="row">
          <button id="p1-dec" class="secondary" type="button">−</button>
          <button id="p1-inc" type="button">+</button>
        </div>
      </div>

      <div class="player-box">
        <h3 id="p2-label">Player 2: 0</h3>
        <div class="row">
          <button id="p2-dec" class="secondary" type="button">−</button>
          <button id="p2-inc" type="button">+</button>
        </div>
      </div>
    </div>
    <h3 id="total-label" class="total-score">Total: 0</h3>
  </main>

  <script>
    let p1 = 0;
    let p2 = 0;

    const p1Label = document.getElementById("p1-label");
    const p2Label = document.getElementById("p2-label");
    const totalLabel = document.getElementById("total-label");

    function updateScores() {
      p1Label.textContent = `Player 1: ${p1}`;
      p2Label.textContent = `Player 2: ${p2}`;
      totalLabel.textContent = `Total: ${p1 + p2}`;
    }

    document.getElementById("p1-inc").addEventListener("click", () => {
      p1 += 1;
      updateScores();
    });

    document.getElementById("p1-dec").addEventListener("click", () => {
      p1 -= 1;
      updateScores();
    });

    document.getElementById("p2-inc").addEventListener("click", () => {
      p2 += 1;
      updateScores();
    });

    document.getElementById("p2-dec").addEventListener("click", () => {
      p2 -= 1;
      updateScores();
    });
  </script>
</body>
</html>
